# E2E - builds the CLI and runs ./e2e against the built dist/cli.js. Two tiers:
#  - e2e-offline: the @offline-tagged tests only. Hermetic (CLI subprocess plus
#    in-process loopback stubs: the site/auth server incl. the @p0 sign-in round
#    trip, and an npm registry), so this is the required signal on every PR/push.
#    No live-stack env or secrets.
#  - e2e-live: the read-only @smoke tests against the dispatched target. Manual
#    dispatch only; nothing signs in or signs up, so no secrets. No browser binaries.
name: E2E

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target site FQDN'
        required: true

jobs:
  e2e-offline:
    name: 🧪 E2E offline (no live stack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build
        run: npm run build

      - name: 🧪 Run offline e2e
        run: npm run test:e2e -- --grep @offline

      - name: 📊 Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-offline-report
          path: playwright-report/
          retention-days: 7

  pack-consumer:
    name: 📦 Pack consumer (plugin subpath)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build
        run: npm run build

      - name: 📦 Pack the publish tarball
        run: |
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack

      - name: 🔌 Import @agentage/cli/plugin from a consumer
        run: |
          set -euo pipefail
          tarball=$(ls /tmp/pack/*.tgz)
          consumer=$(mktemp -d)
          cd "$consumer"
          npm init -y > /dev/null
          npm i "$tarball" --no-audit --no-fund
          node --input-type=module -e "const m = await import('@agentage/cli/plugin'); if (m.PLUGIN_API_VERSION !== '1.0.0') process.exit(1); console.log('plugin subpath ok')"

  e2e-live:
    name: 🧪 E2E vs ${{ inputs.target }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build
        run: npm run build

      - name: 🧪 Run smoke e2e
        run: npm run test:e2e -- --grep @smoke
        env:
          AGENTAGE_SITE_FQDN: ${{ inputs.target }}

      - name: 📊 Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 7
