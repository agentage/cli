name: Release Train

# Fully automated Friday MINOR release of @agentage/cli to npm. No human step on
# the happy path. Weekly cadence, always a minor bump.
#
# Level 2 in the @agentage dependency chain: this repo depends on
# @agentage/memory-core AND @agentage/server-memory, which release earlier the
# same evening. L0 runs 19:00 UTC, L1 runs 20:00 UTC, this L2 train runs 21:00
# UTC so it picks up their freshly published versions. Single plain UTC cron -
# no Prague/DST gate: if GitHub fires the cron late, the train simply departs
# late instead of being gated away.
#
# v2 delivery (2026-08-22): the release commit goes DIRECT TO MASTER. The old
# branch -> PR -> auto-merge -> self-approve -> poll-merged chain broke three
# different ways in three weeks (repo auto-merge setting, the action_required
# approval gate, a guard field bug); none of that machinery exists any more.
# `npm run verify` runs before the push, a rejected push is a red run (never a
# force), and the train only goes green once the dispatched publish run has
# succeeded AND npm actually serves the new version. Red run = the only alarm;
# there are no silent-skip states.
#
# The explicit publish dispatch stays mandatory: a GITHUB_TOKEN push fires no
# push trigger, and release.yml's dispatch path is also the only route that
# bypasses its release-gate commit-message regex.
on:
  schedule:
    - cron: '0 21 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  dependabot-quiescence:
    name: Wait for dependabot triage to finish
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait until this repo has no fresh open dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Dependabot merging is owned by the org triage automation; this job only
          # delays the train while that agent may still be working. PRs still open
          # after the wait were deliberately left by triage - the train departs
          # without them.
          for i in $(seq 1 45); do
            OPEN=$(gh pr list -R "$REPO" --author "app/dependabot" --state open --json number --jq 'length')
            [ "$OPEN" = "0" ] && { echo "No open dependabot PRs - proceeding."; exit 0; }
            echo "poll $i: $OPEN open dependabot PR(s), waiting for triage..."
            sleep 60
          done
          echo "Dependabot PR(s) still open after wait - releasing without them." | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: Cut minor release
    needs: dependabot-quiescence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump internal @agentage/* dependencies to latest
        id: deps
        run: |
          set -euo pipefail
          # L2 upgrade: pull in memory-core + server-memory versions released
          # earlier tonight. A dep change alone justifies the weekly release.
          # --target minor: majors stay a deliberate human/dependabot call, not an auto-bump.
          npx --yes npm-check-updates -u --target minor --dep prod,dev --filter "@agentage/*"
          npm install
          if git diff --quiet -- package.json package-lock.json; then
            echo "No @agentage/* dependency changes."
            echo "deps_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Internal dependencies bumped."
            git --no-pager diff -- package.json | grep -E '@agentage/' || true
            echo "deps_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect releasable commits since the last tag
        id: detect
        run: |
          set -euo pipefail
          # Anchor on the CURRENT release line: the repo carries stale v0.24.x
          # tags from the pre-reboot CLI that sort above the live 0.x line, so
          # semver-max would flag every week as releasable forever. Prefer the
          # tag of the current package.json version; fall back to the nearest
          # ancestor tag.
          PKG_TAG="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/${PKG_TAG}" >/dev/null; then
            LAST_TAG="$PKG_TAG"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          fi
          RANGE=""; [ -n "$LAST_TAG" ] && RANGE="${LAST_TAG}..HEAD"
          echo "Last tag: ${LAST_TAG:-none}"
          SUBJECTS=$(git log $RANGE --no-merges --pretty=%s)
          # Releasable = anything except docs/ci/plain-chore; chore(deps) counts
          # (dependabot bundles ship weekly), chore(release) does not.
          RELEASABLE=$(printf '%s\n' "$SUBJECTS" \
            | grep -vE '^(docs|ci)(\([^)]*\))?!?:' \
            | grep -vE '^chore(\([^)]*\))?!?:' || true)
          DEPS=$(printf '%s\n' "$SUBJECTS" | grep -E '^chore\(deps' || true)
          COUNT=$(printf '%s\n%s\n' "$RELEASABLE" "$DEPS" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "No releasable commits since ${LAST_TAG:-repo start}."
            echo "commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found $COUNT releasable commit(s)."
            echo "commits=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to release
        id: decide
        run: |
          if [ "${{ steps.deps.outputs.deps_changed }}" = "true" ] || [ "${{ steps.detect.outputs.commits }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Neither dep changes nor releasable commits - no release this week." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump minor version
        id: bump
        if: steps.decide.outputs.release == 'true'
        run: |
          set -euo pipefail
          OUT=$(node scripts/bump-version.js minor)
          echo "$OUT"
          NEW=$(echo "$OUT" | grep "NEW_VERSION=" | cut -d= -f2)
          npm install --package-lock-only
          echo "New version: $NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Verify
        if: steps.bump.outputs.version
        run: npm run verify

      - name: Commit release direct to master
        id: push
        if: steps.bump.outputs.version
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): ${VERSION}"
          # master may have moved while the train ran; rebase on it. A rejected
          # push is a red run - never force.
          git pull --rebase origin master
          git push origin HEAD:master
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch publish workflow
        id: dispatch
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A GITHUB_TOKEN push never fires release.yml's push trigger, and its
          # dispatch path is the only route past the release-gate regex. Its
          # dispatch path re-verifies, skips if the version is already on npm,
          # then publishes + tags.
          BEFORE=$(gh run list -R "$REPO" --workflow release.yml --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run release.yml --ref master --repo "$REPO"
          RUN_ID=""
          for i in $(seq 1 24); do
            ID=$(gh run list -R "$REPO" --workflow release.yml --json databaseId --jq '.[0].databaseId // 0')
            [ "$ID" != "$BEFORE" ] && { RUN_ID="$ID"; break; }
            echo "poll $i: dispatched run not visible yet"
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::release.yml dispatch never produced a run"
            echo "Publish dispatch produced no run - ${{ steps.bump.outputs.version }} NOT published." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched publish run https://github.com/$REPO/actions/runs/$RUN_ID"

      - name: Wait for the publish run to finish
        if: steps.dispatch.outputs.run_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          # Fail-closed: a red publish is a red train, not a green one with a
          # stranded version bump on master.
          CONCL=""
          for i in $(seq 1 120); do
            OUT=$(gh run view "$RUN_ID" -R "$REPO" --json status,conclusion --jq '.status + "|" + (.conclusion // "")')
            STATUS="${OUT%%|*}"; CONCL="${OUT##*|}"
            [ "$STATUS" = "completed" ] && break
            echo "poll $i: publish run $STATUS"
            sleep 15
          done
          if [ "$CONCL" != "success" ]; then
            echo "::error::publish run concluded '${CONCL:-timeout}'"
            echo "Publish run https://github.com/$REPO/actions/runs/$RUN_ID concluded '${CONCL:-timeout}' - release incomplete." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Assert npm serves the new version
        if: steps.dispatch.outputs.run_id
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          NAME=$(node -p "require('./package.json').name")
          SERVED=""
          for i in $(seq 1 20); do
            SERVED=$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)
            [ "$SERVED" = "$VERSION" ] && break
            echo "poll $i: npm not serving ${NAME}@${VERSION} yet"
            sleep 15
          done
          if [ "$SERVED" != "$VERSION" ]; then
            echo "::error::npm does not serve ${NAME}@${VERSION}"
            echo "npm never served ${NAME}@${VERSION} - release incomplete." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Released ${NAME}@${VERSION} to npm." >> "$GITHUB_STEP_SUMMARY"
