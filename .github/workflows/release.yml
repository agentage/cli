name: Publish Package

# Publishes on a chore(release) merge via OIDC trusted publishing (npmjs.com publisher = this file).

on:
  push:
    branches: [master, main]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: '22'

jobs:
  # =========================================================================
  # GATE - only publish on a chore(release) merge (prepare-release.yml PR)
  # =========================================================================
  release-gate:
    name: 🔒 Release Gate
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.check.outputs.is-release }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 5

      - name: 🔒 Check if this is a release commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # For workflow_dispatch, always allow
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is-release=true" >> $GITHUB_OUTPUT
            echo "✅ Manual trigger — allowed"
            exit 0
          fi

          # Check if the merge commit came from a release/* branch
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $COMMIT_MSG"

          # Match squash merges from release/* branches or release prepare commits
          # Match: merge commits from release/*, squash merges (PR title "Release v..."), or release prepare commits
          if echo "$COMMIT_MSG" | grep -qE "(^Merge pull request .* from .*/release/|^Release v|^chore: prepare release|^chore\(release\))"; then
            echo "is-release=true" >> $GITHUB_OUTPUT
            echo "✅ Release commit detected — proceeding with publish"
          else
            echo "is-release=false" >> $GITHUB_OUTPUT
            echo "⛔ Not a release commit — skipping publish"
            echo "💡 All releases go through prepare-release.yml"
          fi

  detect-changes:
    name: 🔍 Detect Version Changes
    needs: [release-gate]
    if: needs.release-gate.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.detect.outputs.should-publish }}
      name: ${{ steps.detect.outputs.name }}
      version: ${{ steps.detect.outputs.version }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Detect version changes
        id: detect
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          private=$(node -p "require('./package.json').private || false")

          echo "name=${name}" >> $GITHUB_OUTPUT
          echo "version=${version}" >> $GITHUB_OUTPUT

          if [ "$private" = "true" ]; then
            echo "should-publish=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Package is private, skipping publish"
            exit 0
          fi

          echo "📦 Checking ${name}@${version}..."

          if npm view "${name}@${version}" version 2>/dev/null; then
            echo "should-publish=false" >> $GITHUB_OUTPUT
            echo "⏭️  Version ${version} already published for ${name}"
          else
            echo "should-publish=true" >> $GITHUB_OUTPUT
            echo "✨ New version detected: ${name}@${version}"
          fi

  verify:
    name: ✅ Verify Package
    needs: [detect-changes]
    if: needs.detect-changes.outputs.should-publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Verify
        run: npm run verify

  # agentage/e2e's cli tier (the @smoke one verify-prod runs on the published cli) against this
  # commit, packed and served as npm `latest` on loopback: a cli the e2e tier refuses never ships.
  e2e-cli:
    name: 🧪 e2e cli tier on the candidate
    needs: [detect-changes]
    if: needs.detect-changes.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install, build and pack the candidate
        run: |
          npm ci
          npm run build
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack

      # agentage/e2e is private (the org PAT_TOKEN reads it).
      - name: 📥 Checkout agentage/e2e
        uses: actions/checkout@v7
        with:
          repository: agentage/e2e
          path: e2e-suite
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: 📦 Install agentage/e2e
        run: npm ci --prefix e2e-suite --no-audit --no-fund

      - name: 🧪 cli tier against the candidate
        run: |
          set -euo pipefail
          node scripts/candidate-registry.mjs /tmp/pack/*.tgz /tmp/registry-url > /tmp/registry.log 2>&1 &
          for _ in $(seq 50); do [ -s /tmp/registry-url ] && break; sleep 0.2; done
          export npm_config_registry="$(cat /tmp/registry-url)"
          cd e2e-suite
          npx playwright test --project=cli --grep @smoke --retries=0

      # 17 executed on 2026-11-05; the install must have come from the candidate, not npm.
      - name: ✅ Assert the tier ran, on the candidate
        env:
          MIN_EXECUTED: '17'
        run: |
          set -euo pipefail
          (cd e2e-suite && node scripts/assert-executed.mjs)
          cat /tmp/registry.log
          grep -q "served @agentage/cli@${{ needs.detect-changes.outputs.version }} (the candidate)" /tmp/registry.log

  publish:
    name: 📤 Publish Package
    needs: [detect-changes, verify, e2e-cli]
    if: needs.detect-changes.outputs.should-publish == 'true' && needs.verify.result == 'success' && needs.e2e-cli.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version # OIDC needs npm >= 11.5.1

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build package
        run: npm run build

      - name: 📤 Publish to npm (tolerates only an already-published conflict)
        run: |
          echo "📤 Publishing ${{ needs.detect-changes.outputs.name }}@${{ needs.detect-changes.outputs.version }}"
          npm publish --access public --provenance && exit 0
          npm view "${{ needs.detect-changes.outputs.name }}@${{ needs.detect-changes.outputs.version }}" version >/dev/null 2>&1 && { echo "already on npm"; exit 0; }
          echo "::error::npm publish failed"; exit 1

      - name: 🏷️ Create git tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          TAG_NAME="v${{ needs.detect-changes.outputs.version }}"

          git tag -a "${TAG_NAME}" -m "Release ${{ needs.detect-changes.outputs.name }}@${{ needs.detect-changes.outputs.version }}"
          git push origin "${TAG_NAME}"

      - name: ✅ Published successfully
        run: |
          echo "🎉 Successfully published ${{ needs.detect-changes.outputs.name }}@${{ needs.detect-changes.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "📦 Package URL: https://www.npmjs.com/package/${{ needs.detect-changes.outputs.name }}/v/${{ needs.detect-changes.outputs.version }}" >> $GITHUB_STEP_SUMMARY

  summary:
    name: 📋 Publish Summary
    needs: [release-gate, detect-changes, verify, e2e-cli, publish]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: 📊 Create summary
        run: |
          echo "## 📦 Package Publishing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.release-gate.outputs.is-release }}" != "true" ]; then
            echo "⛔ **Blocked — not a release commit**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All releases go through \`prepare-release.yml\`." >> $GITHUB_STEP_SUMMARY
            echo "Run: \`gh workflow run prepare-release.yml -f bump=patch\`" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.detect-changes.outputs.should-publish }}" != "true" ]; then
            echo "ℹ️ **No new version to publish**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Version ${{ needs.detect-changes.outputs.version }} is already published or package is private." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.verify.result }}" != "success" ]; then
            echo "❌ **Verification failed - package not published**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please fix verification errors and try again." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.e2e-cli.result }}" != "success" ]; then
            echo "❌ **The agentage/e2e cli tier refused the candidate - package not published**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Fix the cli or the e2e test, then re-run release.yml (workflow_dispatch)." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.publish.result }}" == "success" ]; then
            echo "✅ **Package published successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **${{ needs.detect-changes.outputs.name }}** version ${{ needs.detect-changes.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Package failed to publish**" >> $GITHUB_STEP_SUMMARY
          fi
