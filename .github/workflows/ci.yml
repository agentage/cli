name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Verify
        run: npm run verify

      - name: 📊 Test coverage
        run: npm run test:coverage

  pack-smoke:
    name: 📦 Pack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build
        run: npm run build

      - name: 📦 Pack the publish tarball
        run: |
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack

      # Only the declared dependencies (--omit=dev): the bin, the daemon's /health, express and PGlite.
      - name: 🚀 Install the packed CLI and smoke the binary and the daemon
        run: scripts/pack-smoke.sh /tmp/pack/*.tgz

      # A 0.51.1 user updates (D6): every entry moves and runs, the 0.51 files stay; reads npm.
      - name: 🔁 Update from 0.51.1 over its own state
        run: scripts/update-smoke.sh /tmp/pack/*.tgz
